<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestión de Documentos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>📚 Sistema de Gestión de Documentos</h1>
                <p>Proyecto Final - Cloud Computing</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Ingrese su usuario" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                
                <div id="message" class="message"></div>
            </form>
            
            <div class="login-footer">
                <h3>Usuarios de Prueba:</h3>
                <div class="test-users">
                    <div class="user-card">
                        <strong>👨‍🎓 Estudiante</strong>
                        <p>Usuario: <code>estudiante1</code></p>
                        <p>Contraseña: <code>123456</code></p>
                    </div>
                    <div class="user-card">
                        <strong>👨‍🏫 Profesor</strong>
                        <p>Usuario: <code>profesor1</code></p>
                        <p>Contraseña: <code>123456</code></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
