# docker-compose.yml para el Sistema de Gestión de Documentos

version: '3.8'

services:
  # Servicio de la aplicación web (PHP + Apache)
  web:
    build: .
    container_name: gestion_documentos_web
    ports:
      - "8081:80" # Cambiado de 8080 a 8081
    volumes:
      - ./backend:/var/www/html/backend
      - ./frontend:/var/www/html/frontend
    depends_on:
      - mysql
    networks:
      - app-network

  # Servicio de la base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: gestion_documentos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_documentos
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # Servicio de phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gestion_documentos_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8082:80" # Puerto corregido para evitar conflicto
    networks:
      - app-network

  # Servicio de Jenkins
  jenkins:
    image: jenkins/jenkins:lts
    container_name: gestion_documentos_jenkins
    ports:
      - "8080:8080" # Jenkins web UI
      - "50000:50000" # Jenkins agent communication
    volumes:
      - jenkins-data:/var/jenkins_home
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  jenkins-data:
    driver: local
